name: Build Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.2.0)"
        required: true
        default: "v1.0.0"

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_name: catadio-mac
            artifact_glob: dist/*.dmg
          - os: windows-latest
            artifact_name: catadio-win
            artifact_glob: dist/*.exe
          - os: ubuntu-latest
            artifact_name: catadio-linux
            artifact_glob: dist/*.AppImage

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install root dependencies
        run: npm ci

      - name: Install web dependencies
        run: npm ci --prefix web

      - name: Build web assets
        run: npm run build

      - name: Package (Windows / Linux)
        if: runner.os != 'macOS'
        run: npx electron-builder --publish never

      - name: Package (macOS, ad-hoc signed)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          # 1. Build the unpacked .app (electron-builder skips signing: identity=null)
          npx electron-builder --mac --dir --publish never
          # 2. Ad-hoc sign the app so arm64 will launch (required after the
          #    quarantine flag is cleared on downloaded builds)
          APP="$(find dist -maxdepth 2 -name '*.app' | head -n1)"
          echo "Ad-hoc signing: $APP"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          # 3. Package the signed .app into the DMG
          npx electron-builder --mac dmg --prepackaged "$APP" --publish never

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: catadio ${{ github.event.inputs.tag }}
          files: artifacts/**
          body: |
            ### macOS install note

            The `.dmg` is ad-hoc signed but not notarized, so macOS may show
            *"catadio is damaged and can't be opened"* on first launch. After
            dragging the app to Applications, clear the quarantine flag once:

            ```bash
            xattr -cr /Applications/catadio.app
            ```
          generate_release_notes: true
          draft: false
          prerelease: false
